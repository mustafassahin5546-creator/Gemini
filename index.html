<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <div class="left-section">
            <button class="icon-btn menu-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e3e2e6" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            <div class="model-select">
                <span>Gemini</span>
                <span class="model-badge">Flash</span>
                <span class="arrow">▼</span>
                <span class="blue-dot"></span>
            </div>
        </div>
        <div class="right-section">
            <button class="icon-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e3e2e6" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <div class="profile-avatar">⚽</div>
        </div>
    </header>

    <main class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="gemini-sparkle">
                <svg width="56" height="56" viewBox="0 0 24 24">
                    <defs>
                        <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4285f4"/>
                            <stop offset="35%" stop-color="#9b51e0"/>
                            <stop offset="70%" stop-color="#e91e63"/>
                            <stop offset="100%" stop-color="#fbbc05"/>
                        </linearGradient>
                    </defs>
                    <path fill="url(#geminiGrad)" d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z"/>
                </svg>
            </div>
            <h1>Hazır olduğunuzda başlayalım</h1>
        </div>
    </main>

    <footer class="bottom-area">
        <div class="input-pill">
            <button class="pill-btn add-btn">+</button>
            <input type="text" id="userInput" placeholder="Gemini'a sorun" autocomplete="off">
            <button class="pill-btn mic-btn" id="micBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
