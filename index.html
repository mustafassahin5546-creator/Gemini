<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini</title>
    <link rel="stylesheet" href="style_v2.css">
</head>
<body>
    <div class="app-container">
        <!-- ÜST BAR -->
        <header>
            <div class="header-left">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="#e3e2e6" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="3" y1="15" x2="21" y2="15"></line>
                </svg>
                <div class="title-container">
                    <span class="title">Gemini</span>
                    <span class="sub">Flash</span>
                    <svg class="chevron" viewBox="0 0 24 24" fill="#a8c7fa">
                        <path d="M7 10l5 5 5-5z"></path>
                    </svg>
                    <div class="blue-dot"></div>
                </div>
            </div>
            <div class="header-right">
                <svg class="history-icon" viewBox="0 0 24 24" fill="none" stroke="#e3e2e6" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10" stroke-dasharray="4 4"></circle>
                    <path d="M15 9l-4 4-2-2"></path>
                </svg>
                <div class="avatar">⚽</div>
            </div>
        </header>

        <!-- ORTA KISIM -->
        <main>
            <div class="spark-container">
                <svg width="48" height="48" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff7b5a" />
                            <stop offset="30%" stop-color="#ffb347" />
                            <stop offset="70%" stop-color="#4e88f9" />
                            <stop offset="100%" stop-color="#3cc67a" />
                        </linearGradient>
                    </defs>
                    <path d="M50 0 C50 35 65 50 100 50 C65 50 50 65 50 100 C50 65 35 50 0 50 C35 50 50 35 50 0 Z" fill="url(#gemini-grad)"></path>
                </svg>
            </div>
            <h1>Hazır olduğunuzda<br>başlayalım</h1>
        </main>

        <!-- ALT ARAMA KUTUSU -->
        <footer>
            <div class="input-pill">
                <span class="plus-icon">+</span>
                <input type="text" placeholder="Gemini'a sorun" autocomplete="off" readonly>
                <svg class="mic-icon" viewBox="0 0 24 24" fill="#c4c7c5">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
                </svg>
            </div>
        </footer>
    </div>
</body>
</html>
